<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>User Center</title>
<script>
    (function () {
        try {
            const t = localStorage.getItem('uc.access_token');
            if (t) window.location.replace('/web/pages/home.html');
            else window.location.replace('/web/login.html');
        } catch (_) {
            window.location.replace('/web/login.html');
        }
    })();
</script>
</head>
<body></body>
</html>
