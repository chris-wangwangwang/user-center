<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>个人中心 - User Center</title>
<link rel="stylesheet" href="/web/css/style.css">
</head>
<body>
<div id="topbar"></div>

<div class="container">
    <h1 class="page-title">个人中心</h1>
    <p class="page-subtitle">管理你的账号信息</p>

    <div class="grid-2">
        <div class="card">
            <h3>基本资料</h3>
            <form id="profile-form">
                <div class="form-group">
                    <label>用户名</label>
                    <input id="p-username" type="text" disabled style="background:#f3f4f6;">
                </div>
                <div class="form-group">
                    <label for="p-nickname">昵称</label>
                    <input id="p-nickname" type="text">
                </div>
                <div class="form-row">
                    <div class="form-group">
                        <label for="p-email">邮箱</label>
                        <input id="p-email" type="email">
                    </div>
                    <div class="form-group">
                        <label for="p-phone">手机号</label>
                        <input id="p-phone" type="text">
                    </div>
                </div>
                <div class="flex between">
                    <button class="btn" type="submit" id="profile-save">保存修改</button>
                    <span class="muted" id="profile-status"></span>
                </div>
            </form>
        </div>

        <div class="card">
            <h3>修改密码</h3>
            <form id="password-form">
                <div class="form-group">
                    <label for="pw-old">当前密码</label>
                    <input id="pw-old" type="password" required>
                </div>
                <div class="form-group">
                    <label for="pw-new">新密码</label>
                    <input id="pw-new" type="password" required minlength="6" maxlength="64">
                </div>
                <div class="form-group">
                    <label for="pw-confirm">确认新密码</label>
                    <input id="pw-confirm" type="password" required minlength="6" maxlength="64">
                </div>
                <div class="flex between">
                    <button class="btn" type="submit" id="pw-save">修改密码</button>
                    <span class="muted" id="pw-status"></span>
                </div>
            </form>
        </div>
    </div>

    <div class="card">
        <h3>账号信息</h3>
        <table>
            <tr><th style="width:120px;">用户 ID</th><td id="info-id"></td></tr>
            <tr><th>用户名</th><td id="info-username"></td></tr>
            <tr><th>昵称</th><td id="info-nickname"></td></tr>
            <tr><th>邮箱</th><td id="info-email"></td></tr>
            <tr><th>手机号</th><td id="info-phone"></td></tr>
            <tr><th>状态</th><td id="info-status"></td></tr>
            <tr><th>注册时间</th><td id="info-created"></td></tr>
        </table>
    </div>
</div>

<script src="/web/js/api.js"></script>
<script src="/web/js/nav.js"></script>
<script>
    (async () => {
        if (!Nav.mount('home')) return;
        const user = await Nav.ensureUserLoaded();
        if (user) fillProfile(user);
    })();

    function fillProfile(u) {
        document.getElementById('p-username').value = u.username || '';
        document.getElementById('p-nickname').value = u.nickname || '';
        document.getElementById('p-email').value = u.email || '';
        document.getElementById('p-phone').value = u.phone || '';

        document.getElementById('info-id').textContent = u.id || '';
        document.getElementById('info-username').textContent = u.username || '';
        document.getElementById('info-nickname').textContent = u.nickname || '-';
        document.getElementById('info-email').textContent = u.email || '-';
        document.getElementById('info-phone').textContent = u.phone || '-';
        document.getElementById('info-status').innerHTML = u.disabled
            ? '<span class="pill danger">已禁用</span>'
            : '<span class="pill success">正常</span>';
        document.getElementById('info-created').textContent = u.created_at ? fmtTime(u.created_at) : '-';
    }

    document.getElementById('profile-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('profile-status');
        const btn = document.getElementById('profile-save');
        btn.disabled = true;
        status.textContent = '';
        try {
            const body = {};
            const nick = document.getElementById('p-nickname').value.trim();
            const email = document.getElementById('p-email').value.trim();
            const phone = document.getElementById('p-phone').value.trim();
            if (nick) body.nickname = nick;
            if (email) body.email = email;
            if (phone) body.phone = phone;

            const me = await Api.put('/api/v1/users/me', body);
            Auth.setSession({ user: me });
            fillProfile(me);
            status.textContent = '已保存';
            Toast.success('资料已更新');
        } catch (e) {
            status.textContent = e.message || '保存失败';
        } finally {
            btn.disabled = false;
        }
    });

    document.getElementById('password-form').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('pw-status');
        const btn = document.getElementById('pw-save');
        const newPw = document.getElementById('pw-new').value;
        const confirm = document.getElementById('pw-confirm').value;

        if (newPw !== confirm) {
            status.textContent = '两次输入的新密码不一致';
            return;
        }
        btn.disabled = true;
        status.textContent = '';
        try {
            await Api.post('/api/v1/users/me/password', {
                old_password: document.getElementById('pw-old').value,
                new_password: newPw,
            });
            status.textContent = '密码已修改';
            Toast.success('密码已修改，请重新登录');
            document.getElementById('password-form').reset();
            setTimeout(() => Auth.logout(), 1500);
        } catch (e) {
            status.textContent = e.message || '修改失败';
        } finally {
            btn.disabled = false;
        }
    });
</script>
</body>
</html>
